name: FamilyBoard
options:
  bundleIdPrefix: com.hanidayo
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.1'
    CURRENT_PROJECT_VERSION: '2'
targets:
  FamilyBoard:
    type: application
    platform: iOS
    sources: [FamilyBoard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanidayo.familyboard.manager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FamilyBoard
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Tailscale로 연결된 가족 전용 FamilyBoard 서버에 접속합니다.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
schemes:
  FamilyBoard:
    build:
      targets:
        FamilyBoard: all
    archive:
      config: Release
