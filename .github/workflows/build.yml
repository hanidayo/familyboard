name: Build FamilyBoard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test web/*.test.cjs
      - name: Check Ubuntu container startup
        run: |
          docker build -f deploy/Dockerfile -t familyboard:test .
          docker run -d --name familyboard-test -p 127.0.0.1:8790:8790 familyboard:test
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8790/api/state | grep -q '"revision":0'; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8790/api/state | grep '"revision":0'
          docker stop familyboard-test
      - run: |
          mkdir -p dist/familyboard-server
          cp -R web deploy README.md dist/familyboard-server/
          tar -czf dist/FamilyBoard-server-public.tar.gz -C dist familyboard-server
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyBoard-server-public
          path: dist/FamilyBoard-server-public.tar.gz
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle -p android assembleDebug
      - run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/FamilyBoard-Android-test.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose dist/FamilyBoard-Android-test.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging dist/FamilyBoard-Android-test.apk | grep 'application-icon'
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyBoard-Android-test
          path: dist/FamilyBoard-Android-test.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: bash ios/build-unsigned.sh
      - run: |
          test -f ios/build/package/Payload/FamilyBoard.app/FamilyBoard
          test -f ios/build/package/Payload/FamilyBoard.app/Assets.car
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' ios/build/package/Payload/FamilyBoard.app/Info.plist | grep '^AppIcon$'
          file ios/build/package/Payload/FamilyBoard.app/FamilyBoard
          if codesign -dv ios/build/package/Payload/FamilyBoard.app 2>/dev/null; then echo 'Unexpected signing'; exit 1; fi
          unzip -t ios/build/FamilyBoard-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyBoard-iOS-unsigned
          path: ios/build/FamilyBoard-iOS-unsigned.ipa
